<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งรหัสผ่านใหม่ — วิสัญญีพยาบาล รพ.สกลนคร</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <style>
    * { font-family: 'Sarabun', sans-serif; }
    body { background: linear-gradient(135deg, #f3e8ff 0%, #ede9fe 100%); min-height: 100vh; }
    .card { background: #fff; border-radius: 20px; box-shadow: 0 8px 32px rgba(109,40,217,.12); }
    .input {
      width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px;
      font-family: 'Sarabun', sans-serif; font-size: 15px; box-sizing: border-box;
      transition: border-color .2s;
    }
    .input:focus { outline: none; border-color: #7c3aed; }
    .btn-primary {
      width: 100%; background: linear-gradient(135deg, #6d28d9, #9333ea);
      color: #fff; padding: 12px; border-radius: 10px; font-weight: 700;
      font-size: 15px; border: none; cursor: pointer; font-family: 'Sarabun', sans-serif;
      transition: opacity .2s;
    }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .eye-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #94a3b8; font-size: 18px;
      padding: 0; line-height: 1;
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">

  <div class="card max-w-sm w-full p-7">

    <!-- Loading -->
    <div id="loadingPanel" class="text-center py-6">
      <div style="font-size:48px; margin-bottom:16px;">🔑</div>
      <div class="text-lg font-bold text-slate-700 mb-2">กำลังตรวจสอบลิ้งก์...</div>
      <div class="text-sm text-slate-400">กรุณารอสักครู่</div>
    </div>

    <!-- Error: link invalid -->
    <div id="errorPanel" style="display:none" class="text-center py-6">
      <div style="font-size:48px; margin-bottom:16px;">⏰</div>
      <div class="text-lg font-bold text-rose-600 mb-2">ลิ้งก์หมดอายุหรือไม่ถูกต้อง</div>
      <div class="text-sm text-slate-500 mb-1">ลิ้งก์รีเซ็ตมีอายุ 1 ชั่วโมง</div>
      <div class="text-sm text-slate-500 mb-5">กรุณาขอลิ้งก์รีเซ็ตใหม่อีกครั้ง</div>
      <a href="staff.html#forgot" onclick="localStorage.setItem('openForgot','1')"
         class="block w-full text-center bg-violet-600 hover:bg-violet-700 text-white font-semibold text-sm py-2.5 rounded-lg mb-3 transition">
        🔑 ขอลิ้งก์รีเซ็ตใหม่
      </a>
      <a href="staff.html" class="text-xs text-slate-400">← กลับหน้าหลัก</a>
    </div>

    <!-- Reset form -->
    <div id="resetPanel" style="display:none">
      <div class="text-center mb-6">
        <div style="font-size:48px; margin-bottom:8px;">🔐</div>
        <div class="text-xl font-bold text-slate-800">ตั้งรหัสผ่านใหม่</div>
        <div class="text-sm text-slate-500 mt-1">วิสัญญีพยาบาล รพ.สกลนคร</div>
      </div>

      <div class="space-y-3 mb-4">
        <div>
          <label class="text-xs text-slate-600 font-semibold block mb-1">รหัสผ่านใหม่</label>
          <div class="relative">
            <input id="newPassword" type="password" class="input pr-10" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password">
            <button class="eye-btn" onclick="toggleEye('newPassword', this)" type="button">👁</button>
          </div>
        </div>
        <div>
          <label class="text-xs text-slate-600 font-semibold block mb-1">ยืนยันรหัสผ่านใหม่</label>
          <div class="relative">
            <input id="confirmPassword" type="password" class="input pr-10" placeholder="พิมพ์รหัสผ่านอีกครั้ง" autocomplete="new-password" onkeydown="if(event.key==='Enter')setNewPassword()">
            <button class="eye-btn" onclick="toggleEye('confirmPassword', this)" type="button">👁</button>
          </div>
        </div>
      </div>

      <div id="resetMsg" class="text-sm mb-3 text-center" style="display:none"></div>
      <button id="saveBtn" onclick="setNewPassword()" class="btn-primary mb-3">บันทึกรหัสผ่านใหม่</button>
      <div class="text-center">
        <a href="staff.html" class="text-xs text-slate-400">← กลับหน้าหลัก</a>
      </div>
    </div>

    <!-- Success -->
    <div id="successPanel" style="display:none" class="text-center py-6">
      <div style="font-size:56px; margin-bottom:16px;">✅</div>
      <div class="text-xl font-bold text-green-600 mb-2">เปลี่ยนรหัสผ่านสำเร็จ!</div>
      <div class="text-sm text-slate-500 mb-6">กำลังพาคุณไปหน้าเข้าสู่ระบบ...</div>
    </div>

  </div>

  <script>
    function show(id) {
      ['loadingPanel','errorPanel','resetPanel','successPanel'].forEach(p => {
        document.getElementById(p).style.display = p === id ? '' : 'none';
      });
    }

    function toggleEye(inputId, btn) {
      const inp = document.getElementById(inputId);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.textContent = inp.type === 'password' ? '👁' : '🙈';
    }

    // รองรับทั้ง implicit flow (#type=recovery) และ PKCE flow (?code=...)
    window.sb.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        show('resetPanel');
        setTimeout(() => document.getElementById('newPassword').focus(), 100);
      } else if (event === 'SIGNED_IN' && session) {
        const hash   = window.location.hash;
        const params = new URLSearchParams(window.location.search);
        // PKCE: token ส่งมาเป็น ?code= แทน #type=recovery
        const isRecovery = hash.includes('type=recovery') || params.has('code');
        if (isRecovery) {
          show('resetPanel');
          setTimeout(() => document.getElementById('newPassword').focus(), 100);
        } else {
          // ล็อกอินอยู่แล้วและไม่ใช่ recovery → กลับหน้าหลัก
          window.location.href = 'staff.html';
        }
      }
    });

    // Fallback 12 วิ — แสดงปุ่ม refresh แทนที่จะแสดง error ทันที
    setTimeout(() => {
      if (document.getElementById('loadingPanel').style.display !== 'none') {
        show('errorPanel');
      }
    }, 12000);

    async function setNewPassword() {
      const pw  = document.getElementById('newPassword').value;
      const pw2 = document.getElementById('confirmPassword').value;
      const msg = document.getElementById('resetMsg');
      const btn = document.getElementById('saveBtn');

      msg.style.display = '';
      if (pw.length < 6) {
        msg.textContent = '❗ รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
        msg.style.color = '#ef4444';
        return;
      }
      if (pw !== pw2) {
        msg.textContent = '❗ รหัสผ่านทั้งสองช่องไม่ตรงกัน';
        msg.style.color = '#ef4444';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'กำลังบันทึก...';
      try {
        const { error } = await window.sb.auth.updateUser({ password: pw });
        if (error) throw error;
        show('successPanel');
        setTimeout(() => { window.location.href = 'staff.html'; }, 2000);
      } catch(e) {
        msg.textContent = e.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่';
        msg.style.color = '#ef4444';
        btn.disabled = false;
        btn.textContent = 'บันทึกรหัสผ่านใหม่';
      }
    }
  </script>
</body>
</html>
