<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>รายงานสรุปยอดบริการ — วิสัญญี รพ.สกลนคร</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body{font-family:'Sarabun',sans-serif;background:#f1f5f9;}
  .card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .input{width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;background:#fff;}
  .input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15);}
  .btn{padding:8px 14px;border-radius:8px;font-weight:500;font-size:14px;cursor:pointer;transition:all .15s;}
  .btn-primary{background:#2563eb;color:#fff;}.btn-primary:hover{background:#1d4ed8;}
  .btn-ghost{background:#f1f5f9;color:#334155;}.btn-ghost:hover{background:#e2e8f0;}
  .btn-green{background:#16a34a;color:#fff;}.btn-green:hover{background:#15803d;}
  .grad-hero{background:linear-gradient(135deg,#0ea5e9,#2563eb 60%,#7c3aed);}
  th{background:#f8fafc;font-weight:600;font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
  td{font-size:13px;}
  tr:hover td{background:#f8fafc;}
  .badge{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;}
  .tag-morning{background:#dbeafe;color:#1d4ed8;}
  .tag-evening{background:#fef3c7;color:#b45309;}
  .tag-night{background:#ede9fe;color:#5b21b6;}
  .tag-in{background:#dcfce7;color:#15803d;}
  .tag-out{background:#fce7f3;color:#9d174d;}
  .tag-pp{background:#ccfbf1;color:#0f766e;}
  .tab-btn{padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;transition:all .12s;background:#e2e8f0;color:#475569;border:none;}
  .tab-btn.active{background:#2563eb;color:#fff;}
  .tab-btn.active.night{background:#7c3aed;}
  .tab-btn.active.pp{background:#0f766e;}
</style>
</head>
<body class="text-slate-800">

<header class="grad-hero text-white">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-2 flex-wrap">
    <div>
      <div class="text-lg sm:text-xl font-bold">📊 รายงานสรุปยอดบริการ</div>
      <div class="text-white/80 text-xs" id="user-info">กรุณาเข้าสู่ระบบ</div>
    </div>
    <div class="flex gap-2 flex-wrap">
      <a href="service-log.html" class="bg-white/15 text-white text-sm px-3 py-1.5 rounded-lg">📋 บันทึกยอด</a>
      <a href="index.html" class="bg-white/15 text-white text-sm px-3 py-1.5 rounded-lg">🏠 หน้าหลัก</a>
      <button id="signOutBtn" onclick="signOut()" class="hidden bg-rose-500 text-white text-sm px-3 py-1.5 rounded-lg">ออก</button>
    </div>
  </div>
</header>

<!-- Login -->
<div id="loginOverlay" style="display:none" class="fixed inset-0 bg-slate-900/60 z-40 items-center justify-center p-4">
  <div class="card max-w-sm w-full p-6">
    <div id="loginPanel">
      <div class="text-xl font-bold mb-3">เข้าสู่ระบบ</div>
      <div class="space-y-2 mb-3">
        <input id="loginEmail" type="email" class="input" placeholder="อีเมล" autocomplete="username">
        <input id="loginPassword" type="password" class="input" placeholder="รหัสผ่าน" autocomplete="current-password">
      </div>
      <div id="loginError" class="text-xs text-rose-500 mb-2 hidden"></div>
      <button onclick="signIn()" class="btn btn-primary w-full mb-2">เข้าสู่ระบบ</button>
      <div class="text-center text-xs text-slate-500">
        <a href="index.html" class="text-blue-600">กลับหน้าหลัก</a>
      </div>
    </div>
  </div>
</div>

<main class="max-w-7xl mx-auto px-3 sm:px-4 py-5 space-y-4">

  <!-- Tabs -->
  <div class="card p-3">
    <div class="flex gap-2 flex-wrap">
      <button class="tab-btn active" data-tab="in" onclick="switchTab('in')">🕐 ในเวลาราชการ</button>
      <button class="tab-btn" data-tab="out" onclick="switchTab('out')">🌙 นอกเวลาราชการ</button>
      <button class="tab-btn" data-tab="pp" onclick="switchTab('pp')">📋 เยี่ยม Pre/Post op</button>
    </div>
  </div>

  <!-- Filter -->
  <div class="card p-4">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-3">
      <div>
        <label class="text-xs text-slate-500 block mb-1">จากวันที่</label>
        <input id="rpt-from" type="date" class="input">
      </div>
      <div>
        <label class="text-xs text-slate-500 block mb-1">ถึงวันที่</label>
        <input id="rpt-to" type="date" class="input">
      </div>
      <div id="shiftFilterWrap">
        <label class="text-xs text-slate-500 block mb-1">เวร (นอกเวลา)</label>
        <select id="rpt-shift" class="input">
          <option value="">— ทั้งหมด —</option>
          <option>เช้า</option><option>บ่าย</option><option>ดึก</option>
        </select>
      </div>
      <div class="flex items-end gap-2">
        <button onclick="loadReport()" class="btn btn-primary flex-1">🔍 โหลด</button>
        <button onclick="exportExcel()" class="btn btn-green">📥 Excel</button>
      </div>
    </div>
  </div>

  <!-- Summary cards -->
  <div class="grid grid-cols-2 sm:grid-cols-5 gap-3" id="summaryCards"></div>

  <!-- Table -->
  <div class="card p-4">
    <div class="flex items-center justify-between mb-3">
      <div class="font-semibold" id="rptTableTitle">ตารางรายวัน</div>
      <div class="text-xs text-slate-400">คลิกแถวเพื่อแก้ไข</div>
    </div>
    <div class="overflow-x-auto" id="tableWrap">
      <!-- filled by JS -->
    </div>
  </div>

</main>

<!-- Edit Modal -->
<div id="editModal" class="fixed inset-0 bg-black/50 z-40 hidden items-center justify-center p-4">
  <div class="card max-w-2xl w-full max-h-[90vh] overflow-y-auto p-5">
    <div class="flex items-start justify-between mb-4">
      <div class="font-bold text-lg" id="editModalTitle">แก้ไขข้อมูล</div>
      <button onclick="closeEdit()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">×</button>
    </div>
    <div id="editModalBody" class="space-y-3"></div>
    <div class="flex gap-2 mt-4">
      <button onclick="closeEdit()" class="btn btn-ghost flex-1">ยกเลิก</button>
      <button onclick="saveEdit()" class="btn btn-primary flex-1">💾 บันทึก</button>
    </div>
  </div>
</div>

<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script>
/* ── LINE Auto-login ─────────────────────────────────────── */
window._liffPendingLink = false; window._liffIdToken = null;
window._liffAutoLink = async function() {};
window._liffAuthPromise = (async () => {
  if (!/Line\//i.test(navigator.userAgent)) return;
  try {
    const r = await fetch('/api/line-session', { method: 'POST' });
    if (!r.ok) return;
    const d = await r.json();
    if (d.access_token) await window.sb.auth.setSession({ access_token: d.access_token, refresh_token: d.refresh_token });
  } catch (e) { console.warn('[LINE]', e.message); }
})();
/* ─────────────────────────────────────────────────────────── */
</script>
<script>
let currentUser = null, _logs = [], _editId = null, _tab = 'in';

// ===== AUTH =====
async function ensureAuth() {
  try {
    const u = await sbAuth.getUser();
    if (u) {
      currentUser = u;
      const p = await sbAuth.getProfile().catch(()=>null);
      document.getElementById('user-info').textContent = p?.full_name || u.email;
      document.getElementById('signOutBtn').classList.remove('hidden');
      document.getElementById('loginOverlay').style.display = 'none';
      return true;
    }
  } catch(e){}
  document.getElementById('loginOverlay').style.display = 'flex';
  return false;
}
async function signIn() {
  const err = document.getElementById('loginError');
  err.classList.add('hidden');
  try {
    await sbAuth.signIn(document.getElementById('loginEmail').value.trim(),
                        document.getElementById('loginPassword').value);
    location.reload();
  } catch(e){ err.textContent=e.message; err.classList.remove('hidden'); }
}
async function signOut() { await sbAuth.signOut(); location.reload(); }

// ===== TABS =====
function switchTab(tab) {
  _tab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('shiftFilterWrap').style.display = tab === 'out' ? '' : 'none';
  loadReport();
}

// ===== DATE INIT =====
(function() {
  const today = new Date();
  const first = new Date(today.getFullYear(), today.getMonth(), 1);
  document.getElementById('rpt-to').value   = today.toISOString().slice(0,10);
  document.getElementById('rpt-from').value = first.toISOString().slice(0,10);
  document.getElementById('shiftFilterWrap').style.display = 'none'; // default tab = ในเวลา
})();

// ===== LOAD =====
async function loadReport() {
  const from  = document.getElementById('rpt-from').value;
  const to    = document.getElementById('rpt-to').value;
  const shift = document.getElementById('rpt-shift').value;
  const typeMap = { in: 'ในเวลา', out: 'นอกเวลา', pp: 'preop_postop' };
  document.getElementById('tableWrap').innerHTML = '<div class="text-center text-slate-400 py-8">⏳ กำลังโหลด...</div>';
  try {
    let q = sb.from('service_logs').select('*')
      .gte('date', from).lte('date', to)
      .eq('type', typeMap[_tab])
      .order('date', {ascending:true}).order('created_at',{ascending:true});
    if (_tab === 'out' && shift) q = q.eq('shift', shift);
    const { data, error } = await q;
    if (error) throw error;
    _logs = data || [];
    if (_tab === 'pp') { renderPPTable(); renderPPSummary(); }
    else               { renderTable();   renderSummary();   }
  } catch(e) {
    document.getElementById('tableWrap').innerHTML =
      `<div class="text-rose-500 py-4 text-center">${e.message}</div>`;
  }
}

function n(v) { return Number(v)||0; }

// ===== ในเวลา / นอกเวลา TABLE =====
function renderTable() {
  const label = _tab === 'in' ? 'ในเวลาราชการ' : 'นอกเวลาราชการ';
  document.getElementById('rptTableTitle').textContent = `${label} (${_logs.length} รายการ)`;

  if (!_logs.length) {
    document.getElementById('tableWrap').innerHTML =
      '<div class="text-center text-slate-400 py-8">ไม่พบข้อมูลในช่วงที่เลือก</div>';
    return;
  }

  const tot = { pt:0,ga:0,ra:0,mac:0,a1:0,a2:0,a3:0,a4:0,a5:0,a6:0,a1e:0,a2e:0,a3e:0,a4e:0,a5e:0,drop:0,ett:0,handover:0,cpr:0,dot:0,reint:0 };

  const rows = _logs.map(h => {
    const m = h.metrics || {};
    const a = h.asa || {};
    const cx = h.complications || {};
    const cprY = cx.CPR?.state === 'มี' ? 1 : 0;
    const dotY = cx.DOT?.state === 'มี' ? 1 : 0;
    const reY  = (cx.ReIntubation?.state === 'มี' || cx.ReIntube?.state === 'มี') ? 1 : 0;
    tot.pt+=n(m.total); tot.ga+=n(m.ga); tot.ra+=n(m.ra); tot.mac+=n(m.mac);
    tot.a1+=n(a.ASA1); tot.a2+=n(a.ASA2); tot.a3+=n(a.ASA3); tot.a4+=n(a.ASA4); tot.a5+=n(a.ASA5); tot.a6+=n(a.ASA6);
    tot.a1e+=n(a.ASA1E); tot.a2e+=n(a.ASA2E); tot.a3e+=n(a.ASA3E); tot.a4e+=n(a.ASA4E); tot.a5e+=n(a.ASA5E);
    tot.drop+=n(m.drop_ward); tot.ett+=n(m.ett_return||m.ett); tot.handover+=n(m.handover_pm||m.handover);
    tot.cpr+=cprY; tot.dot+=dotY; tot.reint+=reY;
    const shiftTag = h.shift==='เช้า' ? `<span class="badge tag-morning">เช้า</span>`
                   : h.shift==='บ่าย' ? `<span class="badge tag-evening">บ่าย</span>`
                   : h.shift==='ดึก'  ? `<span class="badge tag-night">ดึก</span>` : '';
    return `<tr class="border-b cursor-pointer hover:bg-blue-50" onclick="openEdit('${h.id}')">
      <td class="p-2 whitespace-nowrap font-medium">${sbUtils.fmtDate(h.date)}</td>
      ${_tab==='out'?`<td class="p-2">${shiftTag}</td>`:''}
      <td class="p-2 text-xs text-slate-500">${h.service_point||'-'}</td>
      <td class="p-2 text-center font-bold text-blue-700">${n(m.total)||''}</td>
      <td class="p-2 text-center">${n(m.ga)||''}</td>
      <td class="p-2 text-center">${n(m.ra)||''}</td>
      <td class="p-2 text-center">${n(m.mac)||''}</td>
      <td class="p-2 text-center text-slate-500">${n(a.ASA1)||''}</td>
      <td class="p-2 text-center text-slate-500">${n(a.ASA2)||''}</td>
      <td class="p-2 text-center text-slate-500">${n(a.ASA3)||''}</td>
      <td class="p-2 text-center text-slate-500">${n(a.ASA4)||''}</td>
      <td class="p-2 text-center text-slate-500">${n(a.ASA5)||''}</td>
      <td class="p-2 text-center text-amber-500">${n(a.ASA1E)||''}</td>
      <td class="p-2 text-center text-amber-500">${n(a.ASA2E)||''}</td>
      <td class="p-2 text-center text-amber-500">${n(a.ASA3E)||''}</td>
      <td class="p-2 text-center text-amber-500">${n(a.ASA4E)||''}</td>
      <td class="p-2 text-center text-amber-500">${n(a.ASA5E)||''}</td>
      <td class="p-2 text-center text-violet-600">${n(m.drop_ward)||''}</td>
      <td class="p-2 text-center">${n(m.ett_return||m.ett)||''}</td>
      <td class="p-2 text-center">${n(m.handover_pm||m.handover)||''}</td>
      <td class="p-2 text-center">${cprY?`<span class="text-rose-600 font-bold">🔴</span>`:''}</td>
      <td class="p-2 text-center">${dotY?`<span class="text-amber-600 font-bold">⚠️</span>`:''}</td>
      <td class="p-2 text-center">${reY?`<span class="text-orange-600 font-bold">🔁</span>`:''}</td>
    </tr>`;
  }).join('');

  const shiftCol = _tab==='out' ? '<th class="p-2">เวร</th>' : '';
  document.getElementById('tableWrap').innerHTML = `
    <table class="min-w-full">
      <thead><tr>
        <th class="text-left p-2">วันที่</th>${shiftCol}
        <th class="text-left p-2">จุดบริการ</th>
        <th class="p-2">Pt</th><th class="p-2">GA</th><th class="p-2">RA</th><th class="p-2">MAC</th>
        <th class="p-2">ASA1</th><th class="p-2">ASA2</th><th class="p-2">ASA3</th><th class="p-2">ASA4</th><th class="p-2">ASA5</th>
        <th class="p-2 text-amber-600">1E</th><th class="p-2 text-amber-600">2E</th><th class="p-2 text-amber-600">3E</th><th class="p-2 text-amber-600">4E</th><th class="p-2 text-amber-600">5E</th>
        <th class="p-2 text-violet-600">รอส่งตึก</th><th class="p-2">ETT กลับ</th><th class="p-2">ส่งต่อเวร</th>
        <th class="p-2">CPR</th><th class="p-2">DOT</th><th class="p-2">Re-intub</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr class="border-t-2 border-slate-300 bg-blue-50 font-bold">
        <td class="p-2" colspan="${_tab==='out'?3:2}">รวม ${_logs.length} รายการ</td>
        <td class="p-2 text-center">${tot.pt}</td>
        <td class="p-2 text-center">${tot.ga}</td><td class="p-2 text-center">${tot.ra}</td><td class="p-2 text-center">${tot.mac}</td>
        <td class="p-2 text-center">${tot.a1}</td><td class="p-2 text-center">${tot.a2}</td><td class="p-2 text-center">${tot.a3}</td><td class="p-2 text-center">${tot.a4}</td><td class="p-2 text-center">${tot.a5}</td>
        <td class="p-2 text-center text-amber-600">${tot.a1e}</td><td class="p-2 text-center text-amber-600">${tot.a2e}</td><td class="p-2 text-center text-amber-600">${tot.a3e}</td><td class="p-2 text-center text-amber-600">${tot.a4e}</td><td class="p-2 text-center text-amber-600">${tot.a5e}</td>
        <td class="p-2 text-center text-violet-600">${tot.drop}</td><td class="p-2 text-center">${tot.ett}</td><td class="p-2 text-center">${tot.handover}</td>
        <td class="p-2 text-center text-rose-600">${tot.cpr||''}</td><td class="p-2 text-center text-amber-600">${tot.dot||''}</td><td class="p-2 text-center text-orange-600">${tot.reint||''}</td>
      </tr></tfoot>
    </table>`;
}

function renderSummary() {
  const totalPt = _logs.reduce((s,h)=>s+n(h.metrics?.total),0);
  const totalCpr = _logs.filter(h=>h.complications?.CPR?.state==='มี').length;
  const label = _tab === 'in' ? 'ในเวลา' : 'นอกเวลา';
  document.getElementById('summaryCards').innerHTML = `
    <div class="card p-3 text-center"><div class="text-2xl font-bold text-blue-600">${_logs.length}</div><div class="text-xs text-slate-500 mt-1">รายการ${label}</div></div>
    <div class="card p-3 text-center"><div class="text-2xl font-bold text-slate-700">${totalPt}</div><div class="text-xs text-slate-500 mt-1">ผู้ป่วยรวม</div></div>
    <div class="card p-3 text-center"><div class="text-2xl font-bold text-emerald-600">${_logs.reduce((s,h)=>s+n(h.metrics?.ga),0)}</div><div class="text-xs text-slate-500 mt-1">GA</div></div>
    <div class="card p-3 text-center"><div class="text-2xl font-bold text-violet-600">${_logs.reduce((s,h)=>s+n(h.metrics?.ra),0)}</div><div class="text-xs text-slate-500 mt-1">RA</div></div>
    <div class="card p-3 text-center"><div class="text-2xl font-bold ${totalCpr?'text-rose-600':'text-slate-400'}">${totalCpr||0}</div><div class="text-xs text-slate-500 mt-1">CPR</div></div>`;
}

// ===== Pre/Post op TABLE =====
function renderPPTable() {
  document.getElementById('rptTableTitle').textContent = `เยี่ยม Pre/Post op (${_logs.length} รายการ)`;
  if (!_logs.length) {
    document.getElementById('tableWrap').innerHTML = '<div class="text-center text-slate-400 py-8">ไม่พบข้อมูลในช่วงที่เลือก</div>';
    return;
  }

  const tot = { pre_total:0, pre_before:0, pre_after:0, pre_vis:0, post_elig:0, post_vis:0, post_no:0, asa3:0, sat:0, dead:0, reint:0, cx:0 };

  const rows = _logs.map(h => {
    const m  = h.metrics || {};
    const cx = h.complications || {};
    const issues = h.issues || {};
    tot.pre_total +=n(m.pre_total);
    tot.pre_before+=n(m.pre_visit_before14);
    tot.pre_after +=n(m.pre_visit_after14);
    tot.pre_vis   +=n(m.pre_visit_total);
    tot.post_elig +=n(m.post_eligible);
    tot.post_vis  +=n(m.post_visited);
    tot.post_no   +=n(m.post_not_visited);
    tot.asa3+=n(m.asa_ge_3);
    tot.sat +=n(m.satisfaction_asked);
    tot.dead+=n(m.dead_24hr);
    tot.reint+=n(cx.reintubate);
    tot.cx  +=n(cx.other_count);
    return `<tr class="border-b cursor-pointer hover:bg-teal-50" onclick="openPPEdit('${h.id}')">
      <td class="p-2 whitespace-nowrap font-medium">${sbUtils.fmtDate(h.date)}</td>
      <td class="p-2 font-semibold text-teal-700">${h.service_point||m.team||'-'}</td>
      <td class="p-2 text-center">${n(m.pre_total)||''}</td>
      <td class="p-2 text-center text-slate-500">${n(m.pre_visit_before14)||''}</td>
      <td class="p-2 text-center text-slate-500">${n(m.pre_visit_after14)||''}</td>
      <td class="p-2 text-center font-bold text-blue-700">${n(m.pre_visit_total)||''}</td>
      <td class="p-2 text-center">${n(m.post_eligible)||''}</td>
      <td class="p-2 text-center font-bold text-emerald-700">${n(m.post_visited)||''}</td>
      <td class="p-2 text-center text-rose-500">${n(m.post_not_visited)||''}</td>
      <td class="p-2 text-center text-amber-600">${n(m.asa_ge_3)||''}</td>
      <td class="p-2 text-center text-violet-600">${n(m.satisfaction_asked)||''}</td>
      <td class="p-2 text-center">${n(m.dead_24hr)?`<span class="text-rose-600 font-bold">💀${n(m.dead_24hr)}</span>`:''}</td>
      <td class="p-2 text-center">${n(cx.reintubate)?`<span class="text-orange-600 font-bold">🔁${n(cx.reintubate)}</span>`:''}</td>
      <td class="p-2 text-xs text-slate-500">${cx.other_detail||cx.note||''}</td>

        <th class="p-2 text-blue-600">รวมเยี่ยม<br>ก่อน</th>

      <tfoot><tr class="border-t-2 border-slate-300 bg-teal-50 font-bold">
        <td class="p-2" colspan="2">รวม ${_logs.length} รายการ</td>

}

function renderPPSummary() {
  const pre  = _logs.reduce((s,h)=>s+n(h.metrics?.pre_visit_total),0);
  const post = _logs.reduce((s,h)=>s+n(h.metrics?.post_visited),0);
  const asa3 = _logs.reduce((s,h)=>s+n(h.metrics?.asa_ge_3),0);
  const sat  = _logs.reduce((s,h)=>s+n(h.metrics?.satisfaction_asked),0);
  const dead = _logs.reduce((s,h)=>s+n(h.metrics?.dead_24hr),0);
  document.getElementById('summaryCards').innerHTML = `
    <div class="card p-3 text-center"><div class="text-2xl font-bold text-teal-600">${_logs.length}</div><div class="text-xs text-slate-500 mt-1">รายการ</div></div>
    <div class="card p-3 text-center"><div class="text-2xl font-bold text-blue-600">${pre}</div><div class="text-xs text-slate-500 mt-1">เยี่ยมก่อนรวม</div></div>
    <div class="card p-3 text-center"><div class="text-2xl font-bold text-emerald-600">${post}</div><div class="text-xs text-slate-500 mt-1">เยี่ยมหลังรวม</div></div>
    <div class="card p-3 text-center"><div class="text-2xl font-bold text-amber-600">${asa3}</div><div class="text-xs text-slate-500 mt-1">ASA ≥ 3</div></div>
    <div class="card p-3 text-center"><div class="text-2xl font-bold text-violet-600">${sat}</div><div class="text-xs text-slate-500 mt-1">ความพึงพอใจ</div></div>`;
}

  if (!h) return;

  document.getElementById('editModalBody').innerHTML = `
    <div class="grid grid-cols-2 gap-3">
      <div><label class="text-xs text-slate-500">วันที่</label><input id="e-date" type="date" class="input" value="${h.date||''}"></div>
      <div><label class="text-xs text-slate-500">จุดบริการ</label><input id="e-point" class="input" value="${h.service_point||''}"></div>
    </div>
    <div class="grid grid-cols-4 gap-2 mt-2">
      <div><label class="text-xs text-slate-500">Pt รวม</label><input id="e-total" type="number" class="input" value="${n(m.total)||''}"></div>
      <div><label class="text-xs text-slate-500">GA</label><input id="e-ga" type="number" class="input" value="${n(m.ga)||''}"></div>

    </div>

async function saveEdit() {
  if (!currentUser) { sbUtils.toast('กรุณาเข้าสู่ระบบก่อน','error'); return; }
  const h = _logs.find(x=>x.id===_editId);
  if (!h) return;

  let patch;
  if (_tab === 'pp') {
    const preBefore = parseInt(document.getElementById('e-pre-before').value)||0;
    const preAfter  = parseInt(document.getElementById('e-pre-after').value)||0;
    const postElig  = parseInt(document.getElementById('e-post-elig').value)||0;
    const postVis   = parseInt(document.getElementById('e-post-vis').value)||0;
    patch = {
      date: document.getElementById('e-date').value,
      service_point: document.getElementById('e-point').value,
      notes: document.getElementById('e-notes').value,
      metrics: { ...h.metrics,
        pre_total: parseInt(document.getElementById('e-pre-total').value)||0,
        pre_visit_before14: preBefore, pre_visit_after14: preAfter,
        pre_visit_total: preBefore + preAfter,
        post_eligible: postElig, post_visited: postVis,
        post_not_visited: Math.max(0, postElig - postVis),
        asa_ge_3: parseInt(document.getElementById('e-asa3').value)||0,
      }
    };
  } else {
    patch = {
      date: document.getElementById('e-date').value,
      service_point: document.getElementById('e-point').value,
      location: document.getElementById('e-point').value,
      notes: document.getElementById('e-notes').value,
      metrics: { ...h.metrics,
        total: parseInt(document.getElementById('e-total').value)||0,
        ga:    parseInt(document.getElementById('e-ga').value)||0,
        ra:    parseInt(document.getElementById('e-ra').value)||0,
        mac:   parseInt(document.getElementById('e-mac').value)||0,
      },
      asa: {
        ASA1:  parseInt(document.getElementById('e-asa1').value)||0,
        ASA2:  parseInt(document.getElementById('e-asa2').value)||0,
        ASA3:  parseInt(document.getElementById('e-asa3').value)||0,
        ASA4:  parseInt(document.getElementById('e-asa4').value)||0,
        ASA5:  parseInt(document.getElementById('e-asa5').value)||0,
        ASA1E: parseInt(document.getElementById('e-asa1e').value)||0,
        ASA2E: parseInt(document.getElementById('e-asa2e').value)||0,
        ASA3E: parseInt(document.getElementById('e-asa3e').value)||0,
        ASA4E: parseInt(document.getElementById('e-asa4e').value)||0,
        ASA5E: parseInt(document.getElementById('e-asa5e').value)||0,
      }
    };
  }

  try {
    await sbDB.update('service_logs', _editId, patch);
    Object.assign(h, patch);
    sbUtils.toast('แก้ไขแล้ว ✓','success');
    closeEdit();
    if (_tab === 'pp') { renderPPTable(); renderPPSummary(); }
    else               { renderTable();   renderSummary();   }
  } catch(e) { sbUtils.toast(e.message,'error'); }
}

function closeEdit() {
  document.getElementById('editModal').classList.add('hidden');
  document.getElementById('editModal').classList.remove('flex');
  _editId = null;
}

// ===== EXPORT =====
function exportExcel() {
  if (!_logs.length) { sbUtils.toast('โหลดข้อมูลก่อนครับ','error'); return; }
  let rows, sheetName;

  if (_tab === 'pp') {
    sheetName = 'เยี่ยม Pre-Post op';
    rows = [['วันที่','สาย','Pt ทั้งหมด','เยี่ยมก่อน(ก่อน14)','เยี่ยมก่อน(หลัง14)','รวมเยี่ยมก่อน','เข้าเกณฑ์เยี่ยมหลัง','เยี่ยมหลัง','ไม่ได้เยี่ยม','ASA≥3','ความพึงพอใจ','Dead 24h','Reintubate','ภาวะแทรกซ้อน','ปัญหา']];
    _logs.forEach(h => {
      const m=h.metrics||{}, cx=h.complications||{}, iss=h.issues||{};
      rows.push([h.date, h.service_point||'', n(m.pre_total), n(m.pre_visit_before14), n(m.pre_visit_after14), n(m.pre_visit_total), n(m.post_eligible), n(m.post_visited), n(m.post_not_visited), n(m.asa_ge_3), n(m.satisfaction_asked), n(m.dead_24hr), n(cx.reintubate), cx.other_detail||'', (iss.state||'')+(iss.detail?' '+iss.detail:'')]);
    });
  } else {
    sheetName = _tab === 'in' ? 'ในเวลา' : 'นอกเวลา';
    rows = [['วันที่','เวร','จุดบริการ','Pt รวม','GA','RA','MAC','ASA1','ASA2','ASA3','ASA4','ASA5','1E','2E','3E','4E','5E','รอส่งตึก','ETT กลับ','ส่งต่อเวร','CPR','DOT','Re-intub','หมายเหตุ']];
    _logs.forEach(h => {
      const m=h.metrics||{}, a=h.asa||{}, cx=h.complications||{};
      rows.push([h.date, h.shift||'', h.service_point||'', n(m.total), n(m.ga), n(m.ra), n(m.mac), n(a.ASA1), n(a.ASA2), n(a.ASA3), n(a.ASA4), n(a.ASA5), n(a.ASA1E), n(a.ASA2E), n(a.ASA3E), n(a.ASA4E), n(a.ASA5E), n(m.drop_ward), n(m.ett_return||m.ett), n(m.handover_pm||m.handover), cx.CPR?.state==='มี'?1:0, cx.DOT?.state==='มี'?1:0, (cx.ReIntubation?.state==='มี'||cx.ReIntube?.state==='มี')?1:0, h.notes||'']);
    });
  }

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = Array(rows[0].length).fill({wch:14});
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const from = document.getElementById('rpt-from').value;
  const to   = document.getElementById('rpt-to').value;
  XLSX.writeFile(wb, `ยอดบริการ_${sheetName}_${from}_ถึง_${to}.xlsx`);
  sbUtils.toast('Export สำเร็จ ✓','success');
}

  if (window._liffAuthPromise) await window._liffAuthPromise;
  await ensureAuth();
